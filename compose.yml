services:
  cosmos-emulator:
    image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-preview
    container_name: submission-cosmos-emulator
    ports:
      - "8081:8081"
      - "1234:1234"
    environment:
      PROTOCOL: https
    env_file: compose.env

  sql:
    container_name: submissions-api-sql
    image: mcr.microsoft.com/azure-sql-edge
    restart: unless-stopped
    cap_add:
      - SYS_PTRACE
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=1
    env_file: compose.env

  servicebus-emulator:
    container_name: "submissions-api-servicebus-emulator"
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    pull_policy: always
    volumes:
      - "./docker-compose-servicebus-config.json:/ServiceBus_Emulator/ConfigFiles/Config.json"
    ports:
      - "5672:5672"
      - "5300:5300"
    environment:
      SQL_SERVER: sql
      ACCEPT_EULA: "Y"
    env_file: compose.env
    depends_on:
      - sql
